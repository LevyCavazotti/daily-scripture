<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquivo — Daily Faith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1110;--card:#171b18;--border:#2d342f;--text:#eee9dd;--title:#f7f1e4;--muted:#aaa696;--gold:#b79a62;--gold-light:#d8c49b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b18 0,#0e1110 48%);color:var(--text);font-family:"Crimson Text",serif;line-height:1.7}
header{text-align:center;padding:44px 20px 30px;border-bottom:1px solid var(--border)}.symbol{color:var(--gold);margin-bottom:8px}h1,h2{font-family:"Playfair Display",serif;font-weight:500;color:var(--title)}h1{margin:0;font-size:2.2rem}header p{color:var(--muted);font-style:italic;margin:7px 0 18px}nav{display:flex;justify-content:center;gap:24px}nav a{color:var(--gold-light);text-decoration:none}
main{max-width:800px;margin:50px auto;padding:0 20px}.calendar,.reading{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--gold);padding:28px;box-shadow:0 15px 35px rgba(0,0,0,.3)}
.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.month h2{margin:0;text-align:center;flex:1;color:var(--gold-light);font-size:1.45rem}.nav{width:40px;height:40px;border:1px solid var(--border);border-radius:50%;background:transparent;color:var(--gold-light);font-size:1.2rem;cursor:pointer}.nav:hover{border-color:var(--gold)}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week{margin-bottom:6px}.week div{text-align:center;color:var(--muted);font-size:.85rem;padding:4px 0}.day{min-height:48px;border:1px solid transparent;background:#111512;color:var(--text);border-radius:5px;cursor:pointer;font:inherit}.day:hover{border-color:var(--gold)}.empty,.future{opacity:.16;cursor:default;background:transparent}.today{border-color:var(--gold)}.selected{background:var(--gold);color:#111}.hint{text-align:center;color:var(--muted);font-style:italic;margin:20px 0 0}
.reading{margin-top:28px}.reading h2{margin:0 0 4px}.date{color:var(--muted);font-style:italic}.quote{font-family:"Playfair Display",serif;font-size:1.45rem;line-height:1.6;color:var(--title)}.ref{color:var(--gold-light);font-style:italic}.theme{color:var(--muted);font-size:.9rem;margin-top:10px}button.share{margin-top:22px;font:inherit;color:var(--gold-light);background:transparent;border:1px solid var(--gold);border-radius:22px;padding:8px 20px;cursor:pointer}button.share:hover{background:var(--gold);color:#111}
footer{text-align:center;padding:30px;color:#716f65;border-top:1px solid var(--border);margin-top:60px}@media(max-width:560px){.calendar,.reading{padding:20px 12px}.day{min-height:43px}.month h2{font-size:1.2rem}.quote{font-size:1.25rem}}
</style>
</head>
<body>
<header><div class="symbol">✝</div><h1>Arquivo de Fé</h1><p>Uma palavra para cada dia já vivido.</p><nav><a href="index.html">Hoje</a><a href="arquivo.html">Arquivo</a></nav></header>
<main>
<section class="calendar">
  <div class="month"><button class="nav" id="prev">‹</button><h2 id="month"></h2><button class="nav" id="next">›</button></div>
  <div class="week"><div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div></div>
  <div class="days" id="days"></div>
  <p class="hint">Escolha um dia publicado para reler sua palavra.</p>
</section>
<section class="reading" id="reading" hidden>
  <h2>Palavra do dia</h2><div class="date" id="rdate"></div><p class="quote" id="rquote"></p><div class="ref" id="rref"></div><div class="theme" id="rtheme"></div><button class="share" id="share">Compartilhar</button>
</section>
</main>
<footer>© 2026 — Daily Faith</footer>
<script>
fetch("data/citacoes.json").then(r=>r.json()).then(db=>{
 const items=db.citacoes, start=new Date(2026,0,1), real=new Date(), today=real<start?start:real;
 let current=new Date(today.getFullYear(),today.getMonth(),1), selected=null;
 function seedRandom(seed){let x=seed>>>0;return function(){x=(x+0x6D2B79F5)|0;let t=Math.imul(x^(x>>>15),1|x);t=t+Math.imul(t^(t>>>7),61|t)^t;return((t^(t>>>14))>>>0)/4294967296}}
 function shuffledForYear(year){const a=[...items],rnd=seedRandom(year);for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
 function itemForDate(d){const order=shuffledForYear(d.getFullYear());const day=Math.floor((d-new Date(d.getFullYear(),0,1))/86400000);return order[day%order.length]}
 function same(a,b){return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate()}
 function render(){
  const y=current.getFullYear(),m=current.getMonth(); document.getElementById("month").textContent=new Date(y,m,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  document.getElementById("prev").disabled=(y===start.getFullYear()&&m===start.getMonth());
  document.getElementById("next").disabled=(y===today.getFullYear()&&m===today.getMonth());
  const box=document.getElementById("days");box.innerHTML="";
  const first=new Date(y,m,1).getDay(), total=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++){const e=document.createElement("button");e.className="day empty";e.disabled=true;box.appendChild(e)}
  for(let d=1;d<=total;d++){
   const date=new Date(y,m,d), b=document.createElement("button");b.className="day";b.textContent=d;
   if(date<start||date>today){b.classList.add("future");b.disabled=true}
   if(same(date,today))b.classList.add("today"); if(selected&&same(date,selected))b.classList.add("selected");
   if(!b.disabled)b.onclick=()=>{selected=date;show(date);render()}; box.appendChild(b)
  }
 }
 function show(date){
  const item=itemForDate(date);document.getElementById("reading").hidden=false;
  document.getElementById("rdate").textContent=date.toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
  document.getElementById("rquote").textContent="“"+item.texto+"”";document.getElementById("rref").textContent="— "+item.referencia;document.getElementById("rtheme").textContent=item.tema;
  document.getElementById("share").onclick=async()=>{const text=`“${item.texto}” — ${item.referencia}`,url=location.href;if(navigator.share){try{await navigator.share({title:"Daily Faith",text,url})}catch(e){}}else{try{await navigator.clipboard.writeText(`${text}\n\n${url}`);alert("Palavra e link copiados.")}catch(e){alert(`${text}\n\n${url}`)}}}
 }
 document.getElementById("prev").onclick=()=>{current.setMonth(current.getMonth()-1);render()}
 document.getElementById("next").onclick=()=>{current.setMonth(current.getMonth()+1);render()}
 render();
}).catch(()=>{});
</script>
</body>
</html>
