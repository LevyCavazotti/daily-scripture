<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Arquivo — Daily Faith</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Playfair+Display:wght@400;500;600&display=swap"
  rel="stylesheet"
>


<style>


:root{

  --sky:#dff1fb;

  --sky-light:#f4fbff;

  --blue:#6ea9c8;

  --blue-dark:#315d78;

  --blue-deep:#254b63;

  --white:#ffffff;

  --text:#344957;

  --title:#24485e;

  --muted:#718694;

  --gold:#c8a86b;

  --border:#d8e8f0;

}


*{
  box-sizing:border-box;
}


body{

  margin:0;

  background:
    radial-gradient(
      circle at top,
      #ffffff 0%,
      var(--sky-light) 45%,
      var(--sky) 100%
    );

  color:var(--text);

  font-family:"Crimson Text",serif;

  line-height:1.7;

  min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{

  text-align:center;

  padding:46px 20px 32px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.94),
      rgba(244,251,255,.82)
    );

  border-bottom:1px solid var(--border);
}


.symbol{

  color:var(--gold);

  margin-bottom:10px;

  font-size:1.25rem;
}


h1,
h2{

  font-family:"Playfair Display",serif;

  font-weight:500;

  color:var(--title);
}


h1{

  margin:0;

  font-size:2.3rem;
}


header p{

  color:var(--muted);

  font-style:italic;

  margin:8px 0 20px;

  font-size:1.05rem;
}


/* =========================
   NAV
========================= */

nav{

  display:flex;

  justify-content:center;

  gap:28px;
}


nav a{

  color:var(--blue-dark);

  text-decoration:none;

  padding:4px 9px;

  border-radius:20px;

  transition:.25s ease;
}


nav a:hover{

  background:#e6f4fb;

  color:var(--blue-deep);
}


/* =========================
   MAIN
========================= */

main{

  max-width:820px;

  margin:54px auto;

  padding:0 20px;
}


/* =========================
   CALENDAR
========================= */

.calendar,
.reading{

  background:
    rgba(255,255,255,.94);

  border:1px solid var(--border);

  border-top:4px solid var(--blue);

  border-radius:17px;

  padding:30px;

  box-shadow:
    0 17px 40px rgba(65,112,137,.09);
}


/* =========================
   MONTH
========================= */

.month{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:24px;
}


.month h2{

  margin:0;

  text-align:center;

  flex:1;

  color:var(--blue-dark);

  font-size:1.5rem;
}


.nav{

  width:42px;

  height:42px;

  border:1px solid #b9d4e1;

  border-radius:50%;

  background:#f5fbfe;

  color:var(--blue-dark);

  font-size:1.25rem;

  cursor:pointer;

  transition:.25s ease;
}


.nav:hover{

  border-color:var(--blue);

  background:#e5f4fb;
}


.nav:disabled{

  opacity:.3;

  cursor:default;
}


/* =========================
   WEEK DAYS
========================= */

.week,
.days{

  display:grid;

  grid-template-columns:
    repeat(7,1fr);

  gap:7px;
}


.week{

  margin-bottom:7px;
}


.week div{

  text-align:center;

  color:var(--muted);

  font-size:.85rem;

  padding:4px 0;
}


/* =========================
   DAYS
========================= */

.day{

  min-height:50px;

  border:1px solid transparent;

  background:#f5fbfe;

  color:var(--text);

  border-radius:9px;

  cursor:pointer;

  font:inherit;

  transition:.2s ease;
}


.day:hover{

  border-color:#9fc8dc;

  background:#eaf7fc;

  transform:translateY(-1px);
}


.empty,
.future{

  opacity:.28;

  cursor:default;

  background:transparent;
}


.empty:hover,
.future:hover{

  transform:none;

  border-color:transparent;

  background:transparent;
}


/* DIA ATUAL */

.today{

  border:1px solid var(--blue);

  background:#e4f4fb;

  color:var(--blue-deep);

  font-weight:600;
}


/* DIA SELECIONADO */

.selected{

  background:var(--blue);

  border-color:var(--blue);

  color:white;

  box-shadow:
    0 6px 14px rgba(78,139,170,.20);
}


/* =========================
   HINT
========================= */

.hint{

  text-align:center;

  color:var(--muted);

  font-style:italic;

  margin:22px 0 0;
}


/* =========================
   READING
========================= */

.reading{

  margin-top:30px;

  position:relative;

  overflow:hidden;
}


.reading:after{

  content:"✦";

  position:absolute;

  top:18px;

  right:22px;

  color:var(--gold);

  opacity:.5;
}


.reading h2{

  margin:0 0 5px;

  color:var(--blue-deep);
}


.date{

  color:var(--muted);

  font-style:italic;
}


.quote{

  font-family:"Playfair Display",serif;

  font-size:1.5rem;

  line-height:1.65;

  color:var(--title);
}


.ref{

  color:var(--blue-dark);

  font-style:italic;
}


.theme{

  color:var(--muted);

  font-size:.9rem;

  margin-top:10px;
}


/* =========================
   SHARE
========================= */

button.share{

  margin-top:23px;

  font:inherit;

  color:var(--blue-dark);

  background:#f4fbff;

  border:1px solid #a9cddd;

  border-radius:30px;

  padding:9px 22px;

  cursor:pointer;

  transition:.25s ease;
}


button.share:hover{

  background:var(--blue);

  border-color:var(--blue);

  color:white;

  box-shadow:
    0 7px 18px rgba(67,128,160,.18);
}


/* =========================
   FOOTER
========================= */

footer{

  text-align:center;

  padding:34px 20px;

  color:#8296a3;

  border-top:1px solid var(--border);

  margin-top:65px;

  background:rgba(255,255,255,.45);
}


/* =========================
   MOBILE
========================= */

@media(max-width:560px){

  .calendar,
  .reading{

    padding:21px 13px;

    border-radius:14px;
  }

  .day{

    min-height:44px;

    border-radius:7px;
  }

  .month h2{

    font-size:1.2rem;
  }

  .quote{

    font-size:1.28rem;
  }

  nav{

    gap:16px;
  }

}

</style>

</head>


<body>


<header>

  <div class="symbol">
    ✝
  </div>

  <h1>
    Arquivo de Fé
  </h1>

  <p>
    Uma palavra de paz para cada dia já vivido.
  </p>

  <nav>

    <a href="index.html">
      Hoje
    </a>

    <a href="arquivo.html">
      Arquivo
    </a>

  </nav>

</header>



<main>


<section class="calendar">


  <div class="month">

    <button
      class="nav"
      id="prev"
    >
      ‹
    </button>


    <h2 id="month"></h2>


    <button
      class="nav"
      id="next"
    >
      ›
    </button>

  </div>



  <div class="week">

    <div>Dom</div>
    <div>Seg</div>
    <div>Ter</div>
    <div>Qua</div>
    <div>Qui</div>
    <div>Sex</div>
    <div>Sáb</div>

  </div>


  <div
    class="days"
    id="days"
  ></div>


  <p class="hint">
    Escolha um dia publicado para reler sua palavra.
  </p>


</section>



<section
  class="reading"
  id="reading"
  hidden
>

  <h2>
    Palavra do dia
  </h2>

  <div
    class="date"
    id="rdate"
  ></div>

  <p
    class="quote"
    id="rquote"
  ></p>

  <div
    class="ref"
    id="rref"
  ></div>

  <div
    class="theme"
    id="rtheme"
  ></div>

  <button
    class="share"
    id="share"
  >
    Compartilhar
  </button>

</section>


</main>



<footer>

  © 2026 — Daily Faith

  <br>

  Um pequeno momento de paz, fé e esperança.

</footer>



<script>


fetch("data/citacoes.json")

.then(r => r.json())

.then(db => {


  const items = db.citacoes;


  const start =
    new Date(2026,0,1);


  const real =
    new Date();


  const today =
    real < start
      ? start
      : real;


  let current =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );


  let selected = null;



  /* =========================
     RANDOMIZAÇÃO ANUAL
  ========================= */

  function seedRandom(seed){

    let x = seed >>> 0;

    return function(){

      x =
        (x + 0x6D2B79F5) | 0;

      let t =
        Math.imul(
          x ^ (x >>> 15),
          1 | x
        );

      t =
        t +
        Math.imul(
          t ^ (t >>> 7),
          61 | t
        ) ^ t;

      return (
        (t ^ (t >>> 14)) >>> 0
      ) / 4294967296;

    };

  }



  function shuffledForYear(year){

    const a = [...items];

    const rnd =
      seedRandom(year);


    for(
      let i = a.length - 1;
      i > 0;
      i--
    ){

      const j =
        Math.floor(
          rnd() * (i + 1)
        );


      [
        a[i],
        a[j]
      ] =
      [
        a[j],
        a[i]
      ];

    }


    return a;

  }



  function itemForDate(d){

    const order =
      shuffledForYear(
        d.getFullYear()
      );


    const day =
      Math.floor(
        (
          d -
          new Date(
            d.getFullYear(),
            0,
            1
          )
        ) / 86400000
      );


    return order[
      day % order.length
    ];

  }



  function same(a,b){

    return (

      a.getFullYear()
      ===
      b.getFullYear()

      &&

      a.getMonth()
      ===
      b.getMonth()

      &&

      a.getDate()
      ===
      b.getDate()

    );

  }



  /* =========================
     CALENDÁRIO
  ========================= */

  function render(){

    const y =
      current.getFullYear();


    const m =
      current.getMonth();


    document.getElementById(
      "month"
    ).textContent =

      new Date(y,m,1)
      .toLocaleDateString(
        "pt-BR",
        {
          month:"long",
          year:"numeric"
        }
      );


    document.getElementById(
      "prev"
    ).disabled =

      (
        y === start.getFullYear()
        &&
        m === start.getMonth()
      );


    document.getElementById(
      "next"
    ).disabled =

      (
        y === today.getFullYear()
        &&
        m === today.getMonth()
      );


    const box =
      document.getElementById(
        "days"
      );


    box.innerHTML = "";


    const first =
      new Date(
        y,
        m,
        1
      ).getDay();


    const total =
      new Date(
        y,
        m + 1,
        0
      ).getDate();



    /* espaços vazios */

    for(
      let i = 0;
      i < first;
      i++
    ){

      const e =
        document.createElement(
          "button"
        );

      e.className =
        "day empty";

      e.disabled = true;

      box.appendChild(e);

    }



    /* dias */

    for(
      let d = 1;
      d <= total;
      d++
    ){

      const date =
        new Date(
          y,
          m,
          d
        );


      const b =
        document.createElement(
          "button"
        );


      b.className =
        "day";


      b.textContent =
        d;



      if(
        date < start
        ||
        date > today
      ){

        b.classList.add(
          "future"
        );

        b.disabled = true;

      }



      if(
        same(
          date,
          today
        )
      ){

        b.classList.add(
          "today"
        );

      }



      if(
        selected
        &&
        same(
          date,
          selected
        )
      ){

        b.classList.add(
          "selected"
        );

      }



      if(!b.disabled){

        b.onclick = () => {

          selected = date;

          show(date);

          render();

        };

      }


      box.appendChild(b);

    }

  }



  /* =========================
     MOSTRAR PALAVRA
  ========================= */

  function show(date){

    const item =
      itemForDate(date);


    document.getElementById(
      "reading"
    ).hidden = false;


    document.getElementById(
      "rdate"
    ).textContent =

      date.toLocaleDateString(
        "pt-BR",
        {
          day:"2-digit",
          month:"long",
          year:"numeric"
        }
      );


    document.getElementById(
      "rquote"
    ).textContent =

      "“" +
      item.texto +
      "”";


    document.getElementById(
      "rref"
    ).textContent =

      "— " +
      item.referencia;


    document.getElementById(
      "rtheme"
    ).textContent =

      item.tema;



    document.getElementById(
      "share"
    ).onclick = async () => {


      const text =
        `“${item.texto}” — ${item.referencia}`;


      const url =
        location.href;



      if(navigator.share){

        try{

          await navigator.share({

            title:
              "Daily Faith",

            text,

            url

          });

        }

        catch(e){}

      }


      else{

        try{

          await navigator.clipboard.writeText(
            `${text}\n\n${url}`
          );


          alert(
            "Palavra e link copiados."
          );

        }

        catch(e){

          alert(
            `${text}\n\n${url}`
          );

        }

      }

    };

  }



  /* =========================
     BOTÕES
  ========================= */

  document.getElementById(
    "prev"
  ).onclick = () => {

    current.setMonth(
      current.getMonth() - 1
    );

    render();

  };


  document.getElementById(
    "next"
  ).onclick = () => {

    current.setMonth(
      current.getMonth() + 1
    );

    render();

  };



  render();

})


.catch(() => {});

</script>


</body>

</html>
