<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Faith — Palavra do Dia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --sky:#dff1fb;
  --sky-light:#f4fbff;
  --blue:#6ea9c8;
  --blue-dark:#315d78;
  --blue-deep:#254b63;

  --white:#ffffff;
  --cream:#fbfdff;

  --text:#344957;
  --title:#24485e;
  --muted:#718694;

  --gold:#c8a86b;
  --gold-light:#dfc996;

  --border:#d8e8f0;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  background:
    radial-gradient(
      circle at top,
      #ffffff 0%,
      var(--sky-light) 45%,
      var(--sky) 100%
    );

  color:var(--text);

  font-family:"Crimson Text", serif;

  line-height:1.75;

  min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{
  text-align:center;

  padding:48px 20px 32px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.92),
      rgba(244,251,255,.82)
    );

  border-bottom:1px solid var(--border);
}

.symbol{
  font-size:1.25rem;

  color:var(--gold);

  margin-bottom:12px;

  letter-spacing:.18em;

  opacity:.9;
}

header h1{
  font-family:"Playfair Display", serif;

  font-weight:500;

  color:var(--blue-deep);

  font-size:2.45rem;

  margin:0;

  letter-spacing:.01em;
}

header p{
  margin:8px 0 22px;

  color:var(--muted);

  font-style:italic;

  font-size:1.05rem;
}


/* =========================
   NAVIGATION
========================= */

nav{
  display:flex;

  justify-content:center;

  gap:28px;

  flex-wrap:wrap;
}

nav a{
  color:var(--blue-dark);

  text-decoration:none;

  font-size:1.05rem;

  padding:4px 8px;

  border-radius:20px;

  transition:.25s ease;
}

nav a:hover{
  background:#e6f4fb;

  color:var(--blue-deep);
}


/* =========================
   MAIN
========================= */

main{
  max-width:780px;

  margin:62px auto;

  padding:0 20px;
}


/* =========================
   CARD
========================= */

.card{

  background:
    rgba(255,255,255,.94);

  border:1px solid var(--border);

  border-top:4px solid var(--blue);

  border-radius:18px;

  padding:46px 46px 42px;

  box-shadow:
    0 18px 45px rgba(65,112,137,.10);

  position:relative;

  overflow:hidden;
}


/* detalhe decorativo */

.card:before{

  content:"✦";

  position:absolute;

  top:18px;

  right:24px;

  color:var(--gold);

  opacity:.55;

  font-size:1rem;
}


/* brilho suave */

.card:after{

  content:"";

  position:absolute;

  width:180px;

  height:180px;

  border-radius:50%;

  background:#e8f7ff;

  top:-100px;

  right:-80px;

  opacity:.5;

  pointer-events:none;
}


/* =========================
   LABEL
========================= */

.label{

  text-transform:uppercase;

  letter-spacing:.18em;

  color:var(--blue);

  font-size:.78rem;

  font-weight:600;
}


/* =========================
   DATE
========================= */

.date{

  color:var(--muted);

  font-size:.95rem;

  margin:7px 0 28px;

  font-style:italic;
}


/* =========================
   QUOTE
========================= */

.quote{

  font-family:"Playfair Display", serif;

  font-size:1.7rem;

  line-height:1.65;

  color:var(--title);

  margin:0 0 24px;
}


/* =========================
   REFERENCE
========================= */

.reference{

  color:var(--blue-dark);

  font-style:italic;

  font-size:1.08rem;
}


/* =========================
   THEME
========================= */

.theme{

  display:inline-block;

  margin-top:18px;

  padding:5px 14px;

  border:1px solid #cfe3ed;

  border-radius:30px;

  background:#f4fbff;

  color:var(--blue-dark);

  font-size:.83rem;
}


/* =========================
   BUTTON
========================= */

.actions{

  display:flex;

  gap:12px;

  margin-top:32px;

  flex-wrap:wrap;
}

button,
.button{

  font:inherit;

  color:var(--blue-dark);

  background:#f4fbff;

  border:1px solid #a9cddd;

  border-radius:30px;

  padding:9px 22px;

  cursor:pointer;

  text-decoration:none;

  transition:.25s ease;
}

button:hover,
.button:hover{

  background:var(--blue);

  border-color:var(--blue);

  color:white;

  box-shadow:
    0 7px 18px rgba(67,128,160,.18);
}


/* =========================
   INTRO
========================= */

.intro{

  margin-top:34px;

  text-align:center;

  color:var(--blue-dark);

  font-style:italic;

  font-size:1.05rem;

  opacity:.85;
}


/* =========================
   FOOTER
========================= */

footer{

  text-align:center;

  padding:34px 20px;

  color:#8296a3;

  border-top:1px solid var(--border);

  margin-top:75px;

  font-size:.92rem;

  background:rgba(255,255,255,.45);
}


/* =========================
   MOBILE
========================= */

@media(max-width:560px){

  header{
    padding:40px 18px 28px;
  }

  header h1{
    font-size:2rem;
  }

  main{
    margin:42px auto;
  }

  .card{
    padding:36px 25px 34px;

    border-radius:15px;
  }

  .quote{
    font-size:1.4rem;
  }

  nav{
    gap:15px;
  }

}

</style>
</head>


<body>


<header>

  <div class="symbol">✝</div>

  <h1>Daily Faith</h1>

  <p>Uma palavra de paz para o coração, todos os dias.</p>

  <nav>

    <a href="index.html">Hoje</a>

    <a href="arquivo.html">Arquivo</a>

  </nav>

</header>



<main>

  <section class="card" id="card">

    <div class="label">
      Palavra do dia
    </div>

    <div class="date" id="date"></div>

    <p class="quote" id="quote">
      Carregando...
    </p>

    <div class="reference" id="reference"></div>

    <div class="theme" id="theme"></div>


    <div class="actions">

      <button id="share">
        Compartilhar
      </button>

    </div>

  </section>


  <p class="intro">
    “Aquietai-vos, e sabei que eu sou Deus.” — Salmos 46:10
  </p>

</main>



<footer>

  © 2026 — Daily Faith

  <br>

  <span>
    Um pequeno momento de paz, fé e esperança.
  </span>

</footer>



<script>

fetch("data/citacoes.json")

.then(r => r.json())

.then(db => {

  const items = db.citacoes;

  const start = new Date(2026,0,1);

  const now = new Date();

  const today = now < start ? start : now;


  /*
    EMBARALHAMENTO ANUAL

    Cada ano possui uma ordem diferente,
    mas a ordem permanece igual durante
    todo o ano.
  */

  function seedRandom(seed){

    let x = seed >>> 0;

    return function(){

      x = (x + 0x6D2B79F5) | 0;

      let t = Math.imul(
        x ^ (x >>> 15),
        1 | x
      );

      t = t +
        Math.imul(
          t ^ (t >>> 7),
          61 | t
        ) ^ t;

      return (
        (t ^ (t >>> 14)) >>> 0
      ) / 4294967296;

    };

  }


  function shuffledForYear(year){

    const arr = [...items];

    const random = seedRandom(year);

    for(
      let i = arr.length - 1;
      i > 0;
      i--
    ){

      const j =
        Math.floor(
          random() * (i + 1)
        );

      [
        arr[i],
        arr[j]
      ] = [
        arr[j],
        arr[i]
      ];

    }

    return arr;

  }


  const order =
    shuffledForYear(
      today.getFullYear()
    );


  const dayOfYear =
    Math.floor(
      (
        today -
        new Date(
          today.getFullYear(),
          0,
          1
        )
      ) / 86400000
    );


  const item =
    order[
      dayOfYear % order.length
    ];


  document.getElementById("date")
    .textContent =
    today.toLocaleDateString(
      "pt-BR",
      {
        day:"2-digit",
        month:"long",
        year:"numeric"
      }
    );


  document.getElementById("quote")
    .textContent =
    "“" + item.texto + "”";


  document.getElementById("reference")
    .textContent =
    "— " + item.referencia;


  document.getElementById("theme")
    .textContent =
    item.tema;



  /*
    COMPARTILHAR
  */

  document.getElementById("share").onclick =
    async () => {

      const text =
        `“${item.texto}” — ${item.referencia}`;

      const url =
        location.href;


      if(navigator.share){

        try{

          await navigator.share({

            title:
              "Daily Faith — Palavra do Dia",

            text,

            url

          });

        }catch(e){}

      }

      else{

        try{

          await navigator.clipboard.writeText(
            `${text}\n\n${url}`
          );

          alert(
            "Palavra e link copiados."
          );

        }

        catch(e){

          alert(
            `${text}\n\n${url}`
          );

        }

      }

    };

})

.catch(() => {

  document.getElementById("quote")
    .textContent =
    "Não foi possível carregar a palavra de hoje.";

});

</script>


</body>
</html>
